[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buspirate"
version = "0.1.0"
description = "Serial driver for the Bus Pirate binary (bitbang) protocol"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
buspirate = "buspirate.cli:main"

[tool.setuptools]
packages = ["buspirate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
