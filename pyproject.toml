[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buspirate"
version = "0.5.1"
description = "Driver and dashboard for the Bus Pirate v3/v4 and the ESP32 Bit Pirate"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.23", "websockets>=11"]
dev = ["pytest>=7", "fastapi>=0.100", "uvicorn>=0.23", "websockets>=11", "httpx>=0.24"]
app = ["pywebview>=5"]

[project.scripts]
buspirate = "buspirate.cli:main"

[tool.setuptools]
packages = ["buspirate", "buspirate.bitpirate", "buspirate.devices", "buspirate.web", "buspirate.web.panels"]

[tool.setuptools.package-data]
"buspirate.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
